    <rect x="16" y="184" width="90" height="5" rx="2.5" fill="rgba(99,102,241,0.3)"/>
    <rect x="16" y="198" width="228" height="4" rx="2" fill="rgba(107,114,128,0.15)"/>
    <rect x="16" y="208" width="190" height="4" rx="2" fill="rgba(107,114,128,0.12)"/>
    <rect x="16" y="218" width="215" height="4" rx="2" fill="rgba(107,114,128,0.12)"/>
    <rect x="16" y="228" width="180" height="4" rx="2" fill="rgba(107,114,128,0.08)"/>
    <rect x="16" y="248" width="65" height="5" rx="2.5" fill="rgba(99,102,241,0.3)"/>
