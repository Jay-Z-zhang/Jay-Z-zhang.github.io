    <rect x="16" y="84" width="170" height="4" rx="2" fill="rgba(107,114,128,0.08)"/>
    <!-- Section -->
    <rect x="16" y="102" width="70" height="5" rx="2.5" fill="rgba(99,102,241,0.3)"/>
