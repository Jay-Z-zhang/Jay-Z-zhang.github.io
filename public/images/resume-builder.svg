<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34,197,94,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0b0f1a"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="650" cy="80" r="180" fill="url(#glow)"/>
  <circle cx="150" cy="420" r="120" fill="url(#glow)"/>

  <!-- Resume document mockup -->
  <g transform="translate(200, 60)">
    <!-- Document shadow -->
    <rect x="8" y="8" width="280" height="380" rx="8" fill="rgba(0,0,0,0.3)"/>
    <!-- Document -->
    <rect width="280" height="380" rx="8" fill="#131928" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
    <!-- Header bar -->
    <rect x="20" y="20" width="240" height="8" rx="4" fill="rgba(34,197,94,0.4)"/>
    <rect x="20" y="36" width="160" height="6" rx="3" fill="rgba(148,163,184,0.3)"/>
    <!-- Divider -->
    <line x1="20" y1="56" x2="260" y2="56" stroke="rgba(30,41,59,0.8)" stroke-width="1"/>
    <!-- Text lines -->
    <rect x="20" y="72" width="240" height="5" rx="2.5" fill="rgba(148,163,184,0.2)"/>
    <rect x="20" y="84" width="200" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="96" width="220" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="108" width="180" height="5" rx="2.5" fill="rgba(148,163,184,0.1)"/>
    <!-- Section label -->
    <rect x="20" y="128" width="80" height="6" rx="3" fill="rgba(34,197,94,0.3)"/>
    <!-- More text -->
    <rect x="20" y="144" width="240" height="5" rx="2.5" fill="rgba(148,163,184,0.2)"/>
    <rect x="20" y="156" width="210" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="168" width="230" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <!-- Tags -->
    <rect x="20" y="188" width="50" height="18" rx="9" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)" stroke-width="0.5"/>
    <rect x="78" y="188" width="60" height="18" rx="9" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.3)" stroke-width="0.5"/>
    <rect x="146" y="188" width="45" height="18" rx="9" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.3)" stroke-width="0.5"/>
    <!-- Section label 2 -->
    <rect x="20" y="222" width="100" height="6" rx="3" fill="rgba(34,197,94,0.3)"/>
    <rect x="20" y="238" width="240" height="5" rx="2.5" fill="rgba(148,163,184,0.2)"/>
    <rect x="20" y="250" width="200" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="262" width="220" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="20" y="274" width="190" height="5" rx="2.5" fill="rgba(148,163,184,0.1)"/>
    <!-- Section label 3 -->
    <rect x="20" y="298" width="70" height="6" rx="3" fill="rgba(34,197,94,0.3)"/>
    <rect x="20" y="314" width="240" height="5" rx="2.5" fill="rgba(148,163,184,0.2)"/>
    <rect x="20" y="326" width="180" height="5" rx="2.5" fill="rgba(148,163,184,0.15)"/>
    <!-- Download button -->
    <rect x="20" y="346" width="100" height="22" rx="6" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="42" y="361" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="600">导出 PDF</text>
  </g>

  <!-- Template selector mockup -->
  <g transform="translate(520, 100)">
    <rect width="100" height="130" rx="6" fill="#131928" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/>
    <rect x="10" y="10" width="80" height="4" rx="2" fill="rgba(34,197,94,0.4)"/>
    <rect x="10" y="20" width="60" height="3" rx="1.5" fill="rgba(148,163,184,0.2)"/>
    <rect x="10" y="28" width="70" height="3" rx="1.5" fill="rgba(148,163,184,0.15)"/>
    <rect x="10" y="36" width="50" height="3" rx="1.5" fill="rgba(148,163,184,0.1)"/>
    <text x="20" y="115" fill="rgba(148,163,184,0.5)" font-family="system-ui" font-size="9">模板 A</text>
    <circle cx="85" cy="110" r="8" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M81 110l3 3 5-5" stroke="#22c55e" stroke-width="1.5" fill="none"/>
  </g>

  <g transform="translate(520, 250)">
    <rect width="100" height="130" rx="6" fill="#131928" stroke="rgba(30,41,59,0.6)" stroke-width="1"/>
    <rect x="10" y="10" width="80" height="4" rx="2" fill="rgba(148,163,184,0.2)"/>
    <rect x="10" y="20" width="60" height="3" rx="1.5" fill="rgba(148,163,184,0.1)"/>
    <rect x="10" y="28" width="70" height="3" rx="1.5" fill="rgba(148,163,184,0.08)"/>
    <text x="20" y="115" fill="rgba(148,163,184,0.3)" font-family="system-ui" font-size="9">模板 B</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="2" fill="rgba(34,197,94,0.3)"/>
  <circle cx="720" cy="400" r="2" fill="rgba(34,197,94,0.2)"/>
  <text x="400" y="475" fill="rgba(100,116,139,0.4)" font-family="system-ui" font-size="11" text-anchor="middle">Resume Builder</text>
</svg>