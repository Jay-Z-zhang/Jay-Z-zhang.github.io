    <rect x="16" y="154" width="44" height="14" rx="7" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="0.5"/>
    <rect x="66" y="154" width="52" height="14" rx="7" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="0.5"/>
    <rect x="124" y="154" width="40" height="14" rx="7" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="0.5"/>
