      <rect y="12" width="316" height="22" rx="5" fill="rgba(15,17,23,0.6)" stroke="rgba(37,40,50,0.8)" stroke-width="1"/>
      <text x="10" y="27" fill="rgba(107,114,128,0.4)" font-family="system-ui" font-size="8">张三</text>
    </g>
    <g transform="translate(12, 190)">
      <rect width="316" height="5" rx="2.5" fill="rgba(107,114,128,0.25)"/>
      <rect y="12" width="316" height="22" rx="5" fill="rgba(15,17,23,0.6)" stroke="rgba(37,40,50,0.8)" stroke-width="1"/>
      <text x="10" y="27" fill="rgba(107,114,128,0.4)" font-family="system-ui" font-size="8">增长产品经理 / Growth PM</text>
