<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0b0f1a"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34,197,94,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Glow effects -->
  <circle cx="600" cy="100" r="200" fill="url(#glowGrad)"/>
  <circle cx="200" cy="400" r="150" fill="url(#glowGrad)"/>

  <!-- Funnel shape -->
  <g transform="translate(400, 250)">
    <!-- Funnel layers -->
    <polygon points="-160,-120 160,-120 130,-60 -130,-60" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/>
    <polygon points="-130,-60 130,-60 100,0 -100,0" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.5)" stroke-width="1.5"/>
    <polygon points="-100,0 100,0 70,60 -70,60" fill="rgba(34,197,94,0.25)" stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
    <polygon points="-70,60 70,60 40,120 -40,120" fill="rgba(34,197,94,0.35)" stroke="rgba(34,197,94,0.7)" stroke-width="1.5"/>

    <!-- Funnel labels -->
    <text x="-200" y="-90" fill="rgba(241,245,249,0.7)" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">DAU</text>
    <text x="-165" y="-30" fill="rgba(241,245,249,0.7)" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">活动UV</text>
    <text x="-135" y="30" fill="rgba(241,245,249,0.7)" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">分享UV</text>
    <text x="-105" y="90" fill="rgba(241,245,249,0.8)" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">新客</text>

    <!-- Conversion rates -->
    <text x="200" y="-90" fill="rgba(74,222,128,0.9)" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">100%</text>
    <text x="200" y="-30" fill="rgba(74,222,128,0.9)" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">30%</text>
    <text x="200" y="30" fill="rgba(74,222,128,0.9)" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">10%</text>
    <text x="200" y="90" fill="rgba(74,222,128,0.9)" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">3.5%</text>
  </g>

  <!-- Calculator UI mockup - left side -->
  <g transform="translate(580, 380)">
    <!-- Slider bar -->
    <rect x="-80" y="0" width="160" height="3" rx="1.5" fill="rgba(30,41,59,0.8)"/>
    <rect x="-80" y="0" width="80" height="3" rx="1.5" fill="#22c55e"/>
    <circle cx="0" cy="1.5" r="7" fill="#22c55e" stroke="rgba(34,197,94,0.3)" stroke-width="3"/>

    <!-- Number input -->
    <rect x="90" y="-8" width="60" height="20" rx="4" fill="rgba(15,21,35,0.9)" stroke="rgba(30,41,59,0.8)" stroke-width="1"/>
    <text x="120" y="6" fill="rgba(241,245,249,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">30%</text>

    <!-- Label -->
    <text x="-80" y="-6" fill="rgba(100,116,139,0.8)" font-family="system-ui, sans-serif" font-size="9">活动 UV 率</text>
  </g>

  <!-- K factor badge -->
  <g transform="translate(130, 100)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(30,41,59,0.6)" stroke-width="5"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#22c55e" stroke-width="5"
      stroke-dasharray="160 67" stroke-dashoffset="67" stroke-linecap="round"
      transform="rotate(-90)"/>
    <text x="0" y="-4" fill="#4ade80" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">0.35</text>
    <text x="0" y="10" fill="rgba(100,116,139,0.8)" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">K因子</text>
  </g>

  <!-- ROI badge -->
  <g transform="translate(130, 200)">
    <rect x="-40" y="-14" width="80" height="28" rx="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
    <text x="0" y="5" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.2x</text>
  </g>

  <!-- Flow arrows -->
  <g transform="translate(340, 60)">
    <path d="M0,0 L30,0" stroke="rgba(34,197,94,0.4)" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <path d="M0,20 L30,20" stroke="rgba(34,197,94,0.3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Title -->
  <text x="400" y="460" fill="rgba(100,116,139,0.5)" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Viral Campaign Calculator</text>

  <!-- Decorative dots -->
  <circle cx="100" cy="80" r="2" fill="rgba(34,197,94,0.3)"/>
  <circle cx="700" cy="150" r="2" fill="rgba(34,197,94,0.3)"/>
  <circle cx="650" cy="420" r="2" fill="rgba(34,197,94,0.2)"/>
  <circle cx="150" cy="380" r="1.5" fill="rgba(34,197,94,0.2)"/>
</svg>