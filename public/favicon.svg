<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark rounded background with subtle gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- JZ Monogram -->
  <g filter="url(#shadow)">
    <!-- Z letter (back layer) -->
    <path d="
      M 155 115
      L 415 115
      L 415 165
      L 275 315
      L 275 355
      L 415 355
      L 415 405
      L 155 405
      L 155 355
      L 295 205
      L 295 165
      L 155 165
      Z
    " fill="url(#letterGrad)"/>

    <!-- J letter (front layer, overlapping Z diagonal) -->
    <path d="
      M 255 130
      L 255 340
      C 255 395, 225 425, 185 425
      C 145 425, 115 395, 115 355
      C 115 330, 130 310, 150 310
      C 165 310, 177 322, 177 342
      C 177 362, 187 372, 202 372
      C 222 372, 232 355, 232 330
      L 232 130
      Z
    " fill="url(#letterGrad)"/>
  </g>

  <!-- Subtle edge highlight on Z diagonal -->
  <path d="M 295 205 L 295 355 L 300 355 L 300 205 Z" fill="#94a3b8" opacity="0.2"/>
</svg>
