<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>数据看板</title>
<style>
:root{
  --bg:#0b0f18;--card:#121826;--line:#243044;--text:#e8eef7;--muted:#8b95a8;--accent:#818cf8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 56px;}
h1{font-size:20px;font-weight:700;}
.hidden{display:none!important;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;}
.gate-card p{color:var(--muted);font-size:13px;margin:8px 0 16px;line-height:1.5;}
input[type=password]{width:100%;background:#0b0f18;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:14px;outline:none;}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-primary{background:#6366f1;color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.err{color:#f87171;font-size:12px;margin-top:10px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
select{background:#0b0f18;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.kpi .l{font-size:12px;color:var(--muted);}
.kpi .n{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.03em;}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
.card h2{font-size:14px;font-weight:650;margin-bottom:4px;}
.hint{font-size:11px;color:var(--muted);margin-bottom:8px;}
.plot{width:100%;overflow:hidden;}
.plot svg{width:100%;height:auto;display:block;}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;font-size:12px;color:var(--muted);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
.pages-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;}
.funnel{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.f-step{position:relative;}
.f-bar{height:42px;border-radius:8px;background:linear-gradient(90deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;font-size:13px;min-width:80px;margin:0 auto;}
.f-conv{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:500;text-align:left;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
details{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.65;}
details summary{cursor:pointer;color:#a5b4fc;}
@media (max-width:840px){.kpis,.pages-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){.kpis,.pages-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <form class="gate-card" onsubmit="return login(event)">
    <h1>数据看板</h1>
    <p>输入 STATS_TOKEN 进入</p>
    <input id="tokenInput" type="password" autocomplete="current-password" placeholder="STATS_TOKEN" autofocus>
    <div class="row" style="margin-top:14px;"><button class="btn btn-primary" type="submit">进入</button></div>
    <div id="gateErr" class="err"></div>
  </form>
</div>

<div id="app" class="wrap hidden">
  <div class="top">
    <h1>流量看板</h1>
    <div class="row">
      <select id="daysSel" onchange="load()">
        <option value="7">近 7 天</option>
        <option value="14" selected>近 14 天</option>
        <option value="30">近 30 天</option>
        <option value="60">近 60 天</option>
      </select>
      <button class="btn btn-ghost" type="button" onclick="load()">刷新</button>
      <button class="btn btn-ghost" type="button" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="kpis">
    <div class="kpi" title="page_view 次数之和，UTC 日"><div class="l">页面浏览量 PV</div><div class="n" id="kPv">—</div></div>
    <div class="kpi" title="每日 IP 去重后加总，非周期 UV"><div class="l">日活加总 ΣDAU</div><div class="n" id="kUv">—</div></div>
    <div class="kpi" title="简历工具页 pathname 的 PV"><div class="l">简历工具 PV</div><div class="n" id="kResumePv">—</div></div>
    <div class="kpi" title="导出 PDF + 下载 HTML + 分享"><div class="l">简历产出次数</div><div class="n" id="kOut">—</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>全站每日浏览量</h2>
      <div class="hint">X = 日期（UTC）　Y = PV</div>
      <div class="plot" id="chartAll"></div>
    </div>
    <div class="pages-grid">
      <div class="card">
        <h2>各子页浏览量</h2>
        <div class="hint">X = 页面　Y = PV</div>
        <div class="plot" id="chartPages"></div>
      </div>
      <div class="card">
        <h2>子页每日趋势</h2>
        <div class="hint">X = 日期　Y = PV　点图例可隐藏</div>
        <div class="plot" id="chartPageTrend"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="card">
      <h2>简历工具漏斗</h2>
      <div class="hint">访问工具 → 完成引导 → 提交 AI/导入 → 导出或分享</div>
      <div class="funnel" id="funnel"></div>
    </div>
  </div>
  <details>
    <summary>数据口径</summary>
    PV 为 page_view 次数；切天为 UTC；日活加总是按天 IP 去重后再相加。漏斗分母为上一层次数。打开打印框即计入导出，取消打印仍计数。AI 提交不等于接口成功。
  </details>
</div>
<script>
var API = 'https://api.jayzzhang.online';
var KEY = 'jz_stats_token';
var COLORS = ['#818cf8','#34d399','#fbbf24','#f472b6','#38bdf8','#a78bfa','#fb7185','#2dd4bf'];
var PAGE_NAME = {
  '/': '首页',
  '/blog': '博客',
  '/blog/': '博客',
  '/projects': '项目',
  '/projects/': '项目',
  '/resume-builder': '简历介绍',
  '/resume-builder/': '简历介绍',
  '/apps/resume-builder': '简历工具',
  '/apps/resume-builder/': '简历工具',
  '/viral-calculator': '裂变介绍',
  '/viral-calculator/': '裂变介绍',
  '/apps/viral-calculator': '裂变工具',
  '/apps/viral-calculator/': '裂变工具',
  '/tags': '标签',
  '/tags/': '标签'
};

function token(){ return sessionStorage.getItem(KEY) || ''; }
function fmt(n){ n = +n || 0; return n >= 10000 ? (n/10000).toFixed(1)+'万' : String(Math.round(n)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function pageName(p){
  if (PAGE_NAME[p]) return PAGE_NAME[p];
  if (p.indexOf('/blog/') === 0) return '博客文章';
  if (p.indexOf('/projects/') === 0) return '项目详情';
  if (p.indexOf('/tags/') === 0) return '标签';
  if (p.indexOf('/ops') === 0) return '看板';
  return p || '/';
}
function niceMax(v){
  if (v <= 0) return 1;
  var p = Math.pow(10, Math.floor(Math.log10(v)));
  var n = Math.ceil(v / p);
  if (n > 5) n = 10;
  else if (n > 2) n = 5;
  return n * p;
}

function login(e){
  e.preventDefault();
  var t = document.getElementById('tokenInput').value.trim();
  if (!t) { document.getElementById('gateErr').textContent = '请输入 token'; return false; }
  sessionStorage.setItem(KEY, t);
  boot();
  return false;
}
function logout(){ sessionStorage.removeItem(KEY); location.reload(); }
async function boot(){
  if (!token()) return;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await load();
}
async function load(){
  var days = document.getElementById('daysSel').value;
  try {
    var res = await fetch(API + '/stats?days=' + days, { headers: { Authorization: 'Bearer ' + token() } });
    if (res.status === 401) {
      sessionStorage.removeItem(KEY);
      document.getElementById('gate').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('gateErr').textContent = 'token 无效';
      return;
    }
    if (!res.ok) throw new Error('加载失败');
    render(await res.json());
  } catch (err) { alert(err.message || '加载失败'); }
}

function render(data){
  var rows = (data.days || []).slice().reverse();
  var dates = rows.map(function(d){ return d.day.slice(5); });
  var dailyPv = rows.map(function(d){ return (d.traffic && d.traffic.pv) || 0; });
  var pv = 0, dau = 0, events = {}, pagesTotal = {}, pageDaily = {};
  rows.forEach(function(d, i){
    var t = d.traffic || {};
    pv += t.pv || 0;
    dau += t.uv || 0;
    Object.keys(t.events || {}).forEach(function(k){ events[k] = (events[k]||0) + t.events[k]; });
    Object.keys(t.pages || {}).forEach(function(k){
      if (k.indexOf('/ops') === 0) return;
      pagesTotal[k] = (pagesTotal[k]||0) + t.pages[k];
      if (!pageDaily[k]) pageDaily[k] = rows.map(function(){ return 0; });
      pageDaily[k][i] += t.pages[k] || 0;
    });
  });

  var resumePv = 0;
  Object.keys(pagesTotal).forEach(function(k){
    if (k.indexOf('resume-builder') >= 0) resumePv += pagesTotal[k];
  });
  var out = (events.resume_export_pdf||0) + (events.resume_download_html||0) + (events.resume_share||0);
  document.getElementById('kPv').textContent = fmt(pv);
  document.getElementById('kUv').textContent = fmt(dau);
  document.getElementById('kResumePv').textContent = fmt(resumePv);
  document.getElementById('kOut').textContent = fmt(out);

  document.getElementById('chartAll').innerHTML = barChart(dates, dailyPv, '日期', 'PV');

  var pageItems = Object.keys(pagesTotal).map(function(k){ return {k:k, name:pageName(k), v:pagesTotal[k]}; })
    .sort(function(a,b){ return b.v - a.v; });
  var merged = {};
  pageItems.forEach(function(it){
    merged[it.name] = (merged[it.name]||0) + it.v;
  });
  var mergedItems = Object.keys(merged).map(function(n){ return {name:n, v:merged[n]}; }).sort(function(a,b){ return b.v-a.v; }).slice(0, 8);
  document.getElementById('chartPages').innerHTML = barChart(mergedItems.map(function(i){ return i.name; }), mergedItems.map(function(i){ return i.v; }), '页面', 'PV');

  var topKeys = pageItems.slice(0, 6).map(function(i){ return i.k; });
  var series = topKeys.map(function(k, idx){
    return { name: pageName(k), color: COLORS[idx % COLORS.length], values: pageDaily[k] || dates.map(function(){ return 0; }) };
  });
  document.getElementById('chartPageTrend').innerHTML = lineChart(dates, series, '日期', 'PV');
  document.getElementById('legend').innerHTML = series.map(function(s){
    return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>';
  }).join('');

  var s0 = resumePv;
  var s1 = events.resume_onboard || 0;
  var s2 = (events.resume_import_run||0) + (events.resume_ai_polish_run||0) + (events.resume_ai_rewrite_run||0);
  var s3 = out;
  drawFunnel([
    { name: '1. 访问简历页', v: s0 },
    { name: '2. 完成引导', v: s1 },
    { name: '3. 提交 AI / 导入', v: s2 },
    { name: '4. 导出 / 分享', v: s3 }
  ]);
}

function drawFunnel(steps){
  var max = Math.max.apply(null, steps.map(function(s){ return s.v; }).concat([1]));
  var html = '';
  for (var i = 0; i < steps.length; i++) {
    var w = Math.max(18, Math.round(steps[i].v / max * 100));
    html += '<div class="f-step"><div class="f-bar" style="width:' + w + '%"><span>' + esc(steps[i].name) + '</span><strong>' + fmt(steps[i].v) + '</strong></div></div>';
    if (i < steps.length - 1) {
      var rate = steps[i].v ? Math.round(steps[i+1].v / steps[i].v * 100) + '%' : '—';
      html += '<div class="f-conv">转化 ' + rate + '</div>';
    }
  }
  document.getElementById('funnel').innerHTML = html;
}

function barChart(labels, values, xTitle, yTitle){
  var W = 640, H = 260, L = 48, R = 16, T = 16, B = 52;
  var max = niceMax(Math.max.apply(null, values.concat([0])));
  var iw = W - L - R, ih = H - T - B;
  var n = Math.max(labels.length, 1);
  var gap = 8, bw = Math.max(8, (iw / n) - gap);
  var parts = [];
  parts.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">');
  parts.push('<text x="12" y="14" fill="#8b95a8" font-size="11">' + esc(yTitle) + '</text>');
  parts.push('<text x="' + (W/2) + '" y="' + (H-6) + '" fill="#8b95a8" font-size="11" text-anchor="middle">' + esc(xTitle) + '</text>');
  for (var t = 0; t <= 4; t++) {
    var yv = max * (1 - t/4);
    var y = T + ih * t/4;
    parts.push('<line x1="' + L + '" x2="' + (W-R) + '" y1="' + y + '" y2="' + y + '" stroke="#243044" stroke-width="1"/>');
    parts.push('<text x="' + (L-6) + '" y="' + (y+4) + '" fill="#8b95a8" font-size="10" text-anchor="end">' + fmt(yv) + '</text>');
  }
  values.forEach(function(v, i){
    var h = max ? (v / max) * ih : 0;
    var x = L + i * (iw / n) + gap/2;
    var y = T + ih - h;
    parts.push('<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(h,1) + '" fill="#818cf8" rx="3"><title>' + esc(labels[i]) + ' ' + v + '</title></rect>');
    var lab = String(labels[i]);
    if (lab.length > 6) lab = lab.slice(0,6);
    parts.push('<text x="' + (x + bw/2) + '" y="' + (H-B+16) + '" fill="#8b95a8" font-size="10" text-anchor="middle">' + esc(lab) + '</text>');
  });
  parts.push('</svg>');
  return parts.join('');
}

function lineChart(labels, series, xTitle, yTitle){
  var W = 640, H = 260, L = 48, R = 16, T = 16, B = 52;
  var all = [0];
  series.forEach(function(s){ s.values.forEach(function(v){ all.push(v); }); });
  var max = niceMax(Math.max.apply(null, all));
  var iw = W - L - R, ih = H - T - B;
  var n = Math.max(labels.length, 1);
  function xAt(i){ return L + (n === 1 ? iw/2 : i * iw / (n-1)); }
  function yAt(v){ return T + ih - (max ? v / max * ih : 0); }
  var parts = ['<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">'];
  parts.push('<text x="12" y="14" fill="#8b95a8" font-size="11">' + esc(yTitle) + '</text>');
  parts.push('<text x="' + (W/2) + '" y="' + (H-6) + '" fill="#8b95a8" font-size="11" text-anchor="middle">' + esc(xTitle) + '</text>');
  for (var t = 0; t <= 4; t++) {
    var yv = max * (1 - t/4);
    var y = T + ih * t/4;
    parts.push('<line x1="' + L + '" x2="' + (W-R) + '" y1="' + y + '" y2="' + y + '" stroke="#243044"/>');
    parts.push('<text x="' + (L-6) + '" y="' + (y+4) + '" fill="#8b95a8" font-size="10" text-anchor="end">' + fmt(yv) + '</text>');
  }
  var step = n > 10 ? Math.ceil(n / 7) : 1;
  labels.forEach(function(lab, i){
    if (i % step && i !== n-1) return;
    parts.push('<text x="' + xAt(i) + '" y="' + (H-B+16) + '" fill="#8b95a8" font-size="10" text-anchor="middle">' + esc(lab) + '</text>');
  });
  series.forEach(function(s){
    var d = s.values.map(function(v,i){ return (i? 'L':'M') + xAt(i) + ' ' + yAt(v); }).join(' ');
    parts.push('<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2"/>');
    s.values.forEach(function(v,i){
      parts.push('<circle cx="' + xAt(i) + '" cy="' + yAt(v) + '" r="2.5" fill="' + s.color + '"><title>' + esc(s.name) + ' ' + labSafe(labels[i]) + ' ' + v + '</title></circle>');
    });
  });
  parts.push('</svg>');
  return parts.join('');
}
function labSafe(s){ return String(s||''); }

if (token()) boot();
</script>
</body>
</html>
